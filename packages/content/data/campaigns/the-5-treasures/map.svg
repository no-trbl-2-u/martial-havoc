<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" width="660" height="540"
     role="img" aria-labelledby="map-title map-desc" fill="none" stroke="currentColor">
  <title id="map-title">The Lotus Flower cave: room diagram</title>
  <desc id="map-desc">Eight areas of The 5 Treasures drawn as a graph. The Flat-top mountain leads
  to the Cave entrance; the Cave entrance to the Storage room and the Dining Hall; the Storage room
  and the Dining Hall both to the Kitchen; the Dining Hall to the Attendants room; and the Attendants
  room to the Chieftain quarter and through it the Women quarter, both behind the private
  quarter's key. Drawn from the adjacency table in docs/campaigns/the-5-treasures/map.md; original,
  not traced from the printed plan.</desc>

  <style>
    .room { stroke-width: 1.5; }
    .pool { stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.55; }
    .link { stroke-width: 1.5; }
    .locked { stroke-width: 1.5; stroke-dasharray: 7 5; }
    .way-in { stroke-width: 1.5; }
    .name { font: 500 13px/1.2 ui-sans-serif, system-ui, sans-serif; stroke: none; fill: currentColor; }
    .num { font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; stroke: none; fill: currentColor; opacity: 0.6; }
    .note { font: italic 11px/1.3 ui-sans-serif, system-ui, sans-serif; stroke: none; fill: currentColor; opacity: 0.7; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- passages -->
  <g class="link">
    <line x1="560" y1="404" x2="496" y2="330"/>
    <line x1="497" y1="273" x2="516" y2="181"/>
    <line x1="419" y1="303" x2="303" y2="212"/>
    <line x1="461" y1="128" x2="393" y2="88"/>
    <line x1="312" y1="101" x2="257" y2="171"/>
    <line x1="240" y1="231" x2="240" y2="301"/>
  </g>
  <g class="locked">
    <line x1="182" y1="349" x2="139" y2="371"/>
    <line x1="110" y1="421" x2="110" y2="441"/>
  </g>

  <!-- the way in: the arrow the printed plan draws at the lower right -->
  <path class="way-in" d="M 630 470 L 545 350" marker-end="url(#arrow)"/>
  <text class="note" x="596" y="492" text-anchor="middle">the way in</text>

  <!-- the pool behind the kitchen -->
  <ellipse class="pool" cx="330" cy="26" rx="52" ry="16"/>
  <text class="note" x="330" y="30" text-anchor="middle">the pool</text>

  <!-- areas -->
  <g class="room">
    <ellipse cx="330" cy="70" rx="62" ry="30"/>
    <ellipse cx="520" cy="150" rx="62" ry="30"/>
    <ellipse cx="240" cy="200" rx="62" ry="30"/>
    <ellipse cx="480" cy="300" rx="62" ry="30"/>
    <ellipse cx="240" cy="330" rx="62" ry="30"/>
    <ellipse cx="110" cy="390" rx="62" ry="30"/>
    <ellipse cx="110" cy="470" rx="62" ry="30"/>
    <ellipse cx="560" cy="430" rx="62" ry="30"/>
  </g>

  <g text-anchor="middle">
    <text class="num" x="330" y="63">7</text><text class="name" x="330" y="80">Kitchen</text>
    <text class="num" x="520" y="143">5</text><text class="name" x="520" y="160">Storage room</text>
    <text class="num" x="240" y="193">4</text><text class="name" x="240" y="210">Dining Hall</text>
    <text class="num" x="480" y="293">2</text><text class="name" x="480" y="310">Cave entrance</text>
    <text class="num" x="240" y="323">3</text><text class="name" x="240" y="340">Attendants room</text>
    <text class="num" x="110" y="383">8</text><text class="name" x="110" y="400">Chieftain quarter</text>
    <text class="num" x="110" y="463">6</text><text class="name" x="110" y="480">Women quarter</text>
    <text class="num" x="560" y="423">1</text><text class="name" x="560" y="440">Flat-top mountain</text>
  </g>

  <!-- legend -->
  <g>
    <line class="link" x1="24" y1="34" x2="64" y2="34"/>
    <text class="note" x="72" y="38">passage</text>
    <line class="locked" x1="24" y1="56" x2="64" y2="56"/>
    <text class="note" x="72" y="60">private quarter's key</text>
  </g>
</svg>
